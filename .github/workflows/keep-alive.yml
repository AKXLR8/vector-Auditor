name: Keep HF Space Alive

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HF Space health endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://akshayyy1-vector-auditor.hf.space/health)
          echo "Health check returned: $code"
